<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Flask body -->
  <path d="M75 40 L75 95 L30 165 Q25 175 35 180 L165 180 Q175 175 170 165 L125 95 L125 40 Z" 
        stroke="url(#flaskGrad)" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Flask neck top -->
  <path d="M65 40 L135 40" stroke="url(#flaskGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- DNA double helix inside flask -->
  <path d="M90 130 Q100 120 110 130 Q120 140 110 150 Q100 160 90 150 Q80 140 90 130 Z" 
        stroke="url(#flaskGrad)" stroke-width="4" fill="none"/>
  <path d="M90 115 Q100 105 110 115" stroke="url(#flaskGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M90 163 Q100 153 110 163" stroke="url(#flaskGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Horizontal bars (DNA rungs) -->
  <line x1="88" y1="130" x2="112" y2="130" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="140" x2="112" y2="140" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="150" x2="112" y2="150" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
  <!-- Circuit nodes right -->
  <line x1="125" y1="80" x2="150" y2="65" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="65" x2="170" y2="65" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="170" cy="65" r="6" fill="#3B82F6"/>
  <line x1="150" y1="65" x2="155" y2="45" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="155" cy="45" r="6" fill="#3B82F6"/>
  <line x1="125" y1="100" x2="158" y2="100" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <line x1="158" y1="100" x2="158" y2="85" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="158" cy="85" r="6" fill="#3B82F6"/>
  <!-- Bubble in flask -->
  <circle cx="65" cy="155" r="6" stroke="url(#flaskGrad)" stroke-width="3" fill="none"/>
  <!-- Gradient defs -->
  <defs>
    <linearGradient id="flaskGrad" x1="30" y1="40" x2="170" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
</svg>