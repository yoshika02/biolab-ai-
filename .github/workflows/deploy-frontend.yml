name: Deploy Frontend Worker

on:
  push:
    branches: [main]
    paths:
      - 'biolab-ai/**'
  workflow_dispatch:       # allow manual trigger

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biolab-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Worker
        run: npm run build:worker

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: biolab-ai
          command: deploy .open-next/worker.js --assets .open-next/assets --name biolab-frontend --compatibility-date 2026-05-22 --compatibility-flag nodejs_compat --x-autoconfig=false --keep-vars
