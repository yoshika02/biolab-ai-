name: Deploy Frontend Worker

on:
  push:
    branches: [main]
    paths:
      - 'biolab-ai/**'
  workflow_dispatch:       # allow manual trigger

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biolab-ai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: biolab-ai/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext Worker
        run: npm run build:worker
        env:
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: biolab-ai
          command: deploy
